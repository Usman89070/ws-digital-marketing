name: Deploy to Hostinger (FTP)

# Runs on every push to claude/repo-review-3d-animation-n8216x -- the
# branch this repo treats as "live" for deploy purposes.
on:
  push:
    branches:
      - claude/repo-review-3d-animation-n8216x
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Minify CSS/JS for deploy
        # Minifies the runner's own checkout in place -- the source files
        # in git stay fully readable/commented for future edits; only the
        # copy that gets uploaded below is minified. Browsers cache these
        # files for a year (see .htaccess), so this mainly helps first-time
        # visitors' initial load, not repeat visits.
        run: |
          npx --yes clean-css-cli@5.6.3 -o css/style.css css/style.css
          npx --yes terser@5.36.0 js/main.js -c -m -o js/main.js
          npx --yes terser@5.36.0 js/bg-animation.js -c -m -o js/bg-animation.js

      - name: Deploy via lftp (FTP, explicit passive mode)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Plain FTP (not FTPS) with passive mode forced on: the previous
          # attempt using a third-party action failed with "ECONNRESET
          # (data socket)" on both ftp and ftps, which this gives much
          # finer control over (retries, timeout, explicit passive mode)
          # to try to work around.
          #
          # mirror --reverse (local -> remote) never deletes files that
          # exist on the server but not in this repo unless --delete is
          # also passed, which it deliberately isn't -- config.php (real
          # DB credentials, gitignored, never committed here) and anything
          # uploaded through the admin panel (images/case-studies,
          # images/blog, etc.) must survive every deploy untouched.
          #
          # Target is "/" (the FTP session's own root), NOT the
          # FTP_SERVER_DIR absolute path: this FTP account already logs in
          # chrooted into public_html, so re-specifying that same absolute
          # path as the target made lftp create and write into a bogus
          # nested public_html/home/.../public_html/ directory instead of
          # the real document root -- every deploy "succeeded" for 7+ days
          # while silently never touching the live site at all.
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --verbose --parallel=2 \
              --exclude-glob '.git/' \
              --exclude-glob '.github/' \
              --exclude-glob config.php \
              --exclude-glob config.sample.php \
              --exclude-glob '*.sql' \
              --exclude-glob node_modules \
              ./ /
          "

      - name: Clear PHP opcache on the live server
        # Non-fatal: if CACHE_RESET_TOKEN isn't set up yet, or the request
        # fails for any reason, that should never fail the deploy itself --
        # the files are already uploaded either way. (secrets aren't usable
        # in an `if:` condition, so this just always runs and no-ops safely
        # when the token is empty -- cache-reset.php itself rejects an
        # empty/wrong token with a harmless 403.)
        #
        # Calls the real .php filename on purpose -- .htaccess now carries
        # a specific exception for cache-reset.php in its .php-stripping
        # redirect rule, since that redirect drops the query string and
        # would otherwise silently strip ?token=... before it ever reaches
        # the script (confirmed in two earlier deploy runs: the .php URL
        # got redirected losing the token, and the clean /cache-reset URL
        # 404'd instead of reaching the script some other way).
        continue-on-error: true
        env:
          CACHE_RESET_TOKEN: ${{ secrets.CACHE_RESET_TOKEN }}
        run: |
          curl -fsS "https://wsdigitalmarketing.com.au/cache-reset.php?token=${CACHE_RESET_TOKEN}" || true
