name: Deploy to Hostinger (FTP)

# Runs on every push to claude/repo-review-3d-animation-n8216x -- the
# branch this repo treats as "live" for deploy purposes.
on:
  push:
    branches:
      - claude/repo-review-3d-animation-n8216x
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via lftp (FTP, explicit passive mode)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Plain FTP (not FTPS) with passive mode forced on: the previous
          # attempt using a third-party action failed with "ECONNRESET
          # (data socket)" on both ftp and ftps, which this gives much
          # finer control over (retries, timeout, explicit passive mode)
          # to try to work around.
          #
          # mirror --reverse (local -> remote) never deletes files that
          # exist on the server but not in this repo unless --delete is
          # also passed, which it deliberately isn't -- config.php (real
          # DB credentials, gitignored, never committed here) and anything
          # uploaded through the admin panel (images/case-studies,
          # images/blog, etc.) must survive every deploy untouched.
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --verbose --parallel=2 \
              --exclude-glob '.git/' \
              --exclude-glob '.github/' \
              --exclude-glob config.php \
              --exclude-glob config.sample.php \
              --exclude-glob '*.sql' \
              --exclude-glob node_modules \
              ./ \"$FTP_SERVER_DIR\"
          "

      - name: Clear PHP opcache on the live server
        # Non-fatal: if CACHE_RESET_TOKEN isn't set up yet, or the request
        # fails for any reason, that should never fail the deploy itself --
        # the files are already uploaded either way. (secrets aren't usable
        # in an `if:` condition, so this just always runs and no-ops safely
        # when the token is empty -- cache-reset.php itself rejects an
        # empty/wrong token with a harmless 403.)
        continue-on-error: true
        env:
          CACHE_RESET_TOKEN: ${{ secrets.CACHE_RESET_TOKEN }}
        run: |
          curl -fsS "https://wsdigitalmarketing.com.au/cache-reset.php?token=${CACHE_RESET_TOKEN}" || true
